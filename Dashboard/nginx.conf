server {
    listen 80;

    root /usr/share/nginx/html;
    index dashboard.html;

    location / {
        try_files $uri $uri/ /dashboard.html;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
